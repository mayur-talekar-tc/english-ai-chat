<section class="h-[calc(100vh-4rem)] flex flex-col bg-gray-50">
  <!-- Chat Header -->
  <div class="bg-white border-b border-gray-100 px-4 sm:px-6 py-3">
    <div class="max-w-3xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 bg-green-500 rounded-full flex items-center justify-center">
          <span class="text-white text-xs font-bold">AI</span>
        </div>
        <div>
          <h2 class="text-sm font-semibold text-gray-900">BhashaAI Tutor</h2>
          <div class="flex items-center gap-1.5">
            @if (isLoading()) {
              <span class="w-2 h-2 bg-yellow-400 rounded-full animate-pulse"></span>
              <span class="text-xs text-yellow-500">Typing...</span>
            } @else {
              <span class="w-2 h-2 bg-green-400 rounded-full"></span>
              <span class="text-xs text-gray-400">Online</span>
            }
          </div>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <select
          [value]="selectedLanguage()"
          (change)="onLanguageChange($event)"
          class="bg-gray-50 border border-gray-200 rounded-lg px-3 py-1.5 text-xs font-medium text-gray-600 focus:outline-none focus:ring-2 focus:ring-green-500"
        >
          @for (language of languages; track language.code) {
            <option [value]="language.code">{{ language.flag }} {{ language.name }}</option>
          }
        </select>
        <button (click)="clearHistory()" class="p-1.5 rounded-lg hover:bg-gray-100 transition-colors" title="Clear chat">
          <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Messages -->
  <div #chatContainer class="flex-1 overflow-y-auto px-4 sm:px-6 py-6">
    <div class="max-w-3xl mx-auto space-y-6">
      @for (message of messages(); track $index) {
        @if (message.role === 'ai') {
          <div class="flex items-start gap-3">
            <div class="w-8 h-8 bg-green-500 rounded-full flex items-center justify-center flex-shrink-0 mt-0.5">
              <span class="text-white text-[10px] font-bold">AI</span>
            </div>
            <div class="bg-white rounded-2xl rounded-tl-md px-4 py-3 max-w-[80%] shadow-sm border border-gray-100">
              <p class="text-sm text-gray-700 leading-relaxed whitespace-pre-wrap">{{ message.content }}</p>
            </div>
          </div>
        } @else {
          <div class="flex items-start gap-3 justify-end">
            <div class="bg-green-500 rounded-2xl rounded-tr-md px-4 py-3 max-w-[80%]">
              <p class="text-sm text-white leading-relaxed whitespace-pre-wrap">{{ message.content }}</p>
            </div>
          </div>
        }
      }

      <!-- Typing Indicator -->
      @if (isLoading()) {
        <div class="flex items-start gap-3">
          <div class="w-8 h-8 bg-green-500 rounded-full flex items-center justify-center flex-shrink-0">
            <span class="text-white text-[10px] font-bold">AI</span>
          </div>
          <div class="bg-white rounded-2xl rounded-tl-md px-4 py-3 shadow-sm border border-gray-100">
            <div class="flex items-center gap-1.5">
              <div class="w-2 h-2 bg-gray-300 rounded-full animate-bounce" style="animation-delay: 0ms"></div>
              <div class="w-2 h-2 bg-gray-300 rounded-full animate-bounce" style="animation-delay: 150ms"></div>
              <div class="w-2 h-2 bg-gray-300 rounded-full animate-bounce" style="animation-delay: 300ms"></div>
            </div>
          </div>
        </div>
      }
    </div>
  </div>

  <!-- Input -->
  <div class="bg-white border-t border-gray-100 px-4 sm:px-6 py-4">
    <div class="max-w-3xl mx-auto">
      <div class="flex items-center gap-3 bg-gray-50 rounded-2xl border border-gray-200 focus-within:border-green-500 focus-within:ring-2 focus-within:ring-green-500/20 px-4 py-2 transition-all">
        <input
          type="text"
          [ngModel]="userMessage()"
          (ngModelChange)="userMessage.set($event)"
          (keydown)="onKeyDown($event)"
          placeholder="Type your message..."
          class="flex-1 bg-transparent text-sm text-gray-700 placeholder-gray-400 focus:outline-none"
          [disabled]="isLoading()"
        />
        <button
          (click)="sendMessage()"
          [disabled]="!userMessage().trim() || isLoading()"
          class="p-2 rounded-xl transition-all"
          [class]="userMessage().trim() && !isLoading() ? 'bg-green-500 text-white hover:bg-green-600 shadow-sm' : 'bg-gray-200 text-gray-400 cursor-not-allowed'"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14m-7-7l7 7-7 7"/>
          </svg>
        </button>
      </div>
      <p class="text-[10px] text-gray-400 text-center mt-2">BhashaAI can make mistakes. Verify important info.</p>
    </div>
  </div>
</section>
