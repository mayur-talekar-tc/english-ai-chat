<nav class="bg-white/80 backdrop-blur-md border-b border-gray-100 sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      <!-- Logo -->
      <a routerLink="/" class="flex items-center gap-0.5">
        <span class="text-xl font-semibold text-gray-900">Bhasha</span>
        <span class="text-xl font-semibold text-green-500">AI</span>
      </a>

      <!-- Desktop Nav -->
      <div class="hidden md:flex items-center gap-8">
        <a routerLink="/" routerLinkActive="text-green-500" [routerLinkActiveOptions]="{ exact: true }"
           class="text-sm font-medium text-gray-600 hover:text-green-500 transition-colors">Home</a>
        <a routerLink="/learn" routerLinkActive="text-green-500"
           class="text-sm font-medium text-gray-600 hover:text-green-500 transition-colors">Learn</a>
        <a routerLink="/chat" routerLinkActive="text-green-500"
           class="text-sm font-medium text-gray-600 hover:text-green-500 transition-colors">AI Chat</a>
        <a routerLink="/quiz" routerLinkActive="text-green-500"
           class="text-sm font-medium text-gray-600 hover:text-green-500 transition-colors">Quiz</a>
        <a routerLink="/voice" routerLinkActive="text-green-500"
           class="text-sm font-medium text-gray-600 hover:text-green-500 transition-colors">Voice</a>
      </div>

      <!-- Desktop Auth -->
      <div class="hidden md:flex items-center gap-3">
        @if (auth.isLoggedIn()) {
          <span class="text-sm font-medium text-gray-700">{{ auth.currentUser()?.name }}</span>
          <button (click)="auth.logout()" class="text-sm font-medium text-gray-500 hover:text-red-500 px-4 py-2 transition-colors">Logout</button>
        } @else {
          <a routerLink="/login" class="text-sm font-medium text-gray-700 hover:text-green-500 px-4 py-2 transition-colors">Login</a>
          <a routerLink="/register" class="text-sm font-medium text-white bg-green-500 hover:bg-green-600 px-5 py-2 rounded-full transition-all shadow-sm hover:shadow-md">Get Started</a>
        }
      </div>

      <!-- Mobile Hamburger -->
      <button (click)="toggleMenu()" class="md:hidden p-2 rounded-lg hover:bg-gray-100 transition-colors">
        @if (!mobileMenuOpen()) {
          <svg class="w-6 h-6 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        } @else {
          <svg class="w-6 h-6 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        }
      </button>
    </div>
  </div>

  <!-- Mobile Menu -->
  @if (mobileMenuOpen()) {
    <div class="md:hidden border-t border-gray-100 bg-white">
      <div class="px-4 py-4 space-y-3">
        <a routerLink="/" (click)="toggleMenu()" class="block text-sm font-medium text-gray-700 hover:text-green-500 py-2 transition-colors">Home</a>
        <a routerLink="/learn" (click)="toggleMenu()" class="block text-sm font-medium text-gray-700 hover:text-green-500 py-2 transition-colors">Learn</a>
        <a routerLink="/chat" (click)="toggleMenu()" class="block text-sm font-medium text-gray-700 hover:text-green-500 py-2 transition-colors">AI Chat</a>
        <a routerLink="/quiz" (click)="toggleMenu()" class="block text-sm font-medium text-gray-700 hover:text-green-500 py-2 transition-colors">Quiz</a>
        <a routerLink="/voice" (click)="toggleMenu()" class="block text-sm font-medium text-gray-700 hover:text-green-500 py-2 transition-colors">Voice</a>
        <hr class="border-gray-100">
        @if (auth.isLoggedIn()) {
          <span class="block text-sm font-medium text-gray-700 py-2">{{ auth.currentUser()?.name }}</span>
          <button (click)="auth.logout(); toggleMenu()" class="block w-full text-left text-sm font-medium text-red-500 py-2">Logout</button>
        } @else {
          <a routerLink="/login" (click)="toggleMenu()" class="block text-sm font-medium text-gray-700 py-2">Login</a>
          <a routerLink="/register" (click)="toggleMenu()" class="block w-full text-sm font-medium text-white bg-green-500 hover:bg-green-600 px-5 py-2.5 rounded-full transition-all text-center">Get Started</a>
        }
      </div>
    </div>
  }
</nav>
